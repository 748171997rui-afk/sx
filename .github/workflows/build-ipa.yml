name: Build iOS IPA

# 手动触发（Actions 页签 → Run workflow），或推送到 main 自动构建
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 前置检查：Secrets 缺失时尽早失败并给出明确提示 ----------
      - name: 检查签名材料（仓库 Secrets）
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          missing=0
          for v in P12_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD MOBILEPROVISION_BASE64 APPLE_TEAM_ID SIGNING_CERT_NAME EXPORT_METHOD; do
            val="${!v}"
            if [ -z "$val" ]; then echo "::error::缺少 Secret：$v"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::请按 README.md 的 Secrets 清单在仓库 Settings → Secrets and variables → Actions 配好后重新运行"
            exit 1
          fi

      # 仓库里同时内置了最新版页面（ios-app/Resources/index.html）；
      # 若同仓还放有 sixun-report 源码目录则优先同步它。
      - name: 准备 App 页面资源
        run: |
          if [ -f sixun-report/index.html ]; then
            cp sixun-report/index.html ios-app/Resources/index.html
          fi
          ls -la ios-app/Resources/

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      # ---------- 签名材料（全部来自仓库 Secrets，不落仓库文件） ----------
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo -n "$P12_BASE64" | base64 --decode -o $CERT_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Import provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build.mobileprovision
          echo -n "$PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< \
            "$(security cms -D -i $PP_PATH)")
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< \
            "$(security cms -D -i $PP_PATH)")
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "使用描述文件：$PROFILE_NAME"

      # ---------- 生成带签名的 exportOptions ----------
      - name: Prepare exportOptions
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
          SIGNING_CERT_NAME: ${{ secrets.SIGNING_CERT_NAME }}
        run: |
          python3 - <<'PY'
          import os
          src = open('exportOptions.plist', encoding='utf-8').read()
          for key in ('EXPORT_METHOD', 'APPLE_TEAM_ID', 'SIGNING_CERT_NAME', 'PROFILE_NAME'):
              src = src.replace('${%s}' % key, os.environ.get(key, ''))
          open('exportOptions.plist', 'w', encoding='utf-8').write(src)
          PY
          cat exportOptions.plist

      # ---------- 编译（归档时即完成签名） ----------
      - name: Archive
        working-directory: ios-app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_CERT_NAME: ${{ secrets.SIGNING_CERT_NAME }}
        run: |
          xcodebuild archive \
            -project SalesBoard.xcodeproj \
            -scheme SalesBoard \
            -configuration Release \
            -archivePath ../build/SalesBoard.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="$SIGNING_CERT_NAME" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/SalesBoard.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalesBoard-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
