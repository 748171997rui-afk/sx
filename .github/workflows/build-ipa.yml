name: Build iOS IPA

# 手动触发（Actions 页签 → Run workflow），或推送到 main 自动构建
# 有证书 Secrets → 出签名 IPA；没有 → 自动兜底编译「免签 IPA」（可用 Sideloadly/AltStore 自签安装）
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 判断签名材料是否齐备（齐备→签名构建；缺→免签兜底） ----------
      - name: 检查签名材料
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          missing=""
          for v in P12_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD MOBILEPROVISION_BASE64 APPLE_TEAM_ID SIGNING_CERT_NAME EXPORT_METHOD; do
            val="${!v}"
            if [ -z "$val" ]; then missing="$missing $v"; fi
          done
          if [ -z "$missing" ]; then
            echo "HAS_SIGNING=true" >> $GITHUB_ENV
            echo "签名材料齐全，将出【签名 IPA】"
          else
            echo "HAS_SIGNING=false" >> $GITHUB_ENV
            echo "::warning::缺少 Secrets:$missing —— 本次将编译【免签 IPA】，装到手机需要用 Sideloadly / AltStore 等工具自签，或配好 Secrets 后重跑"
          fi

      # 仓库里内置了最新版页面（ios-app/Resources/index.html）；
      # 若同仓还放有 sixun-report 源码目录则优先同步它。
      - name: 准备 App 页面资源
        run: |
          if [ -f sixun-report/index.html ]; then
            cp sixun-report/index.html ios-app/Resources/index.html
          fi
          ls -la ios-app/Resources/

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      # ================= 有签名材料：标准签名流程 =================
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          echo -n "$P12_BASE64" | base64 --decode -o $CERT_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Import provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build.mobileprovision
          echo -n "$PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< \
            "$(security cms -D -i $PP_PATH)")
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< \
            "$(security cms -D -i $PP_PATH)")
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "使用描述文件：$PROFILE_NAME"

      - name: Prepare exportOptions
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
          SIGNING_CERT_NAME: ${{ secrets.SIGNING_CERT_NAME }}
        run: |
          python3 - <<'PY'
          import os
          src = open('exportOptions.plist', encoding='utf-8').read()
          for key in ('EXPORT_METHOD', 'APPLE_TEAM_ID', 'SIGNING_CERT_NAME', 'PROFILE_NAME'):
              src = src.replace('${%s}' % key, os.environ.get(key, ''))
          open('exportOptions.plist', 'w', encoding='utf-8').write(src)
          PY
          cat exportOptions.plist

      - name: Archive (signed)
        if: env.HAS_SIGNING == 'true'
        working-directory: ios-app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_CERT_NAME: ${{ secrets.SIGNING_CERT_NAME }}
        run: |
          xcodebuild archive \
            -project SalesBoard.xcodeproj \
            -scheme SalesBoard \
            -configuration Release \
            -archivePath ../build/SalesBoard.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="$SIGNING_CERT_NAME" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA (signed)
        if: env.HAS_SIGNING == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/SalesBoard.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa

      # ================= 无签名材料：免签兜底（手工打 Payload 包） =================
      - name: Archive (unsigned)
        if: env.HAS_SIGNING == 'false'
        working-directory: ios-app
        run: |
          xcodebuild archive \
            -project SalesBoard.xcodeproj \
            -scheme SalesBoard \
            -configuration Release \
            -archivePath ../build/SalesBoard.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""

      - name: Package unsigned IPA
        if: env.HAS_SIGNING == 'false'
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/SalesBoard.xcarchive/Products/Applications/SalesBoard.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../SalesBoard-unsigned.ipa Payload
          cd ../..
          ls -la build/

      # ---------- 统一上传 ----------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalesBoard-ipa
          path: |
            build/ipa/*.ipa
            build/*.ipa
          if-no-files-found: error
          retention-days: 30
